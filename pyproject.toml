[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cathy-epg"
version = "0.1.0"
description = "XMLTV collector for selected provider guides with authorised UK programme artwork links"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
]

[project.scripts]
epg = "epg_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epg_tool = ["sky_de_title_translations.json"]
