[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "official-epg-search"
version = "0.1.0"
description = "Official-source-only weekly EPG collector for Astro, NOW TV Hong Kong, and StarHub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
]

[project.scripts]
epg = "epg_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
