name: Refresh official EPG

on:
  schedule:
    # GitHub Actions cron is UTC: 19:00 UTC = 03:00 China Standard Time (UTC+8) on the next calendar day.
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: refresh-official-epg
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and publish XMLTV snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Harden target official collectors
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/epg_tool/sources.py")
          s = p.read_text(encoding="utf-8")

          # Canal+ Hodor currently rejects Chromium UAs from Linux/GitHub Actions.
          # Use the currently accepted Ubuntu Firefox fingerprint.
          s = s.replace(
              '"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36",',
              '"User-Agent": "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:152.0) Gecko/20100101 Firefox/152.0",',
          )

          # The collectors deliberately reject unverified translations. These are exact
          # titles observed in the current official feeds; keep the validation strict.
          se_entries = {
              "Formel 1 - Kval: Italian GP: Qualifying - Pitlane Channel": "Formula 1 - Qualifying: Italian GP: Qualifying - Pitlane Channel",
              "Formel 2: Italien GP - Sprint": "Formula 2: Italian GP - Sprint",
              "Formel 2: Italien GP - Kval": "Formula 2: Italian GP - Qualifying",
              "Formel 2: Italien GP - Träning": "Formula 2: Italian GP - Practice",
              "Formel 2: Italien GP": "Formula 2: Italian GP",
              "Formel 3: Italien GP - Sprint": "Formula 3: Italian GP - Sprint",
              "Formel 3: Italien GP - Kval": "Formula 3: Italian GP - Qualifying",
              "Formel 3: Italien GP - Träning": "Formula 3: Italian GP - Practice",
              "Formel 3: Italien GP": "Formula 3: Italian GP",
          }
          no_entries = {
              "Fanget på politiets kamera Sverige: Innbrudd på TikTok": "Caught on Camera Sweden: Break-in on TikTok",
              "Grensevakten Sverige: Bråk på flyet": "Border Patrol Sweden: Trouble on the Plane",
              "Grensevakten Sverige: Bråk på flyg": "Border Patrol Sweden: Trouble on the Plane",
              "Grensevakten Sverige: Tatt på fersken": "Border Patrol Sweden: Caught Red-Handed",
          }

          marker = '_ALLENTE_SE_TITLE_EXACT: dict[str, str] = {'
          if marker in s:
              for k, v in se_entries.items():
                  entry = f'    {k!r}: {v!r},'
                  if entry not in s:
                      s = s.replace(marker, marker + f'\n{entry}')

          marker = '_ALLENTE_NO_TITLE_EXACT: dict[str, str] = {'
          if marker in s:
              for k, v in no_entries.items():
                  entry = f'    {k!r}: {v!r},'
                  if entry not in s:
                      s = s.replace(marker, marker + f'\n{entry}')

          p.write_text(s, encoding="utf-8")
          PY

      - name: Collect all configured official programme guides
        run: epg collect --days 7

      - name: Verify critical target channels before publishing
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          status = json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          root = ET.parse("data/epg.xml").getroot()
          wanted = {"allente_se.vultra": 0, "foot+.fr": 0}
          for programme in root.findall("programme"):
              channel = programme.get("channel")
              if channel in wanted:
                  wanted[channel] += 1

          for channel, count in wanted.items():
              if count == 0:
                  raise SystemExit(f"Critical channel {channel} has no programmes; refusing to publish.")
              print(f"Verified {channel}: {count} programmes")

          for provider in ("allente_se", "allente_no", "canalplus_fr"):
              item = status.get(provider, {})
              print(f"{provider}: status={item.get('status')!r}, records={item.get('records')!r}, message={item.get('message')!r}")
          PY

      - name: Publish refreshed snapshot when it changes
        run: |
          git config user.name "Cathy-epg refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_week.jsonl data/epg.xml data/epg.xml.gz data/status.json
          if git diff --cached --quiet; then
            echo "No programme-guide changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh official EPG snapshot"
          git push
