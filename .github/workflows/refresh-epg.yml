name: Refresh official EPG

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: refresh-official-epg
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and publish XMLTV snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Harden and patch official collectors
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("src/epg_tool/sources.py")
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              '"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36",',
              '"User-Agent": "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:152.0) Gecko/20100101 Firefox/152.0",',
          )

          tree = ast.parse(source)
          targets = {
              "_translate_allente_se_title": "sv",
              "_translate_allente_no_title": "no",
              "_translate_digi4k_title": "ro",
              "_translate_tvplus_eurosport_title": "tr",
              "_translate_magenta_tv_sky_de_title": "de",
          }
          found = set()

          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              if node.name not in targets:
                  continue
              found.add(node.name)
              node.body = [
                  ast.ImportFrom(
                      module="epg_tool.translation_fallback",
                      names=[ast.alias(name="translate_title", asname="_cathy_translate_title")],
                      level=0,
                  ),
                  ast.Return(
                      value=ast.Call(
                          func=ast.Name(id="_cathy_translate_title", ctx=ast.Load()),
                          args=[ast.Name(id="title", ctx=ast.Load()), ast.Constant(value=targets[node.name])],
                          keywords=[],
                      )
                  ),
              ]

          missing = set(targets) - found
          if missing:
              raise SystemExit("Translation functions missing: " + ", ".join(sorted(missing)))

          ast.fix_missing_locations(tree)
          path.write_text(ast.unparse(tree) + "\n", encoding="utf-8")
          print("Patched translation functions:", ", ".join(sorted(found)))

          # TVEpg 当前真实频道页使用下划线 slug，且节目表在频道主页中按 Today/Tomorrow 分组。
          # 不请求不存在的 /YYYY-MM-DD 路径，避免 GitHub Actions 收到 403。
          override = r'''
from datetime import datetime, timedelta
from zoneinfo import ZoneInfo
import re
from bs4 import BeautifulSoup
import requests

TVEPG_EUROSPORT_1_GUIDE = "https://tvepg.eu/en/switzerland/channel/eurosport_1_e"

def collect_tvepg_eurosport_1(days: int = 7) -> list[Programme]:
    if days not in range(1, 8):
        raise ValueError("TVEpg Eurosport 1 采集天数必须为 1–7。")
    session = _session()
    session.headers.update({
        "Accept": "text/html,application/xhtml+xml",
        "Referer": "https://tvepg.eu/en/switzerland/",
    })
    zone = ZoneInfo("Europe/Zurich")
    today = datetime.now(zone).date()
    last_day = today + timedelta(days=days)
    response = session.get(TVEPG_EUROSPORT_1_GUIDE, timeout=30)
    response.raise_for_status()
    soup = BeautifulSoup(response.text, "html.parser")
    records: list[Programme] = []
    current_date = None
    pending: list[tuple[datetime, str]] = []

    def flush() -> None:
        nonlocal pending
        for index, (start, title) in enumerate(pending):
            if index + 1 < len(pending):
                end = pending[index + 1][0]
            else:
                end = start + timedelta(hours=2)
            if end <= start:
                continue
            if today <= start.date() < last_day:
                records.append(
                    Programme(
                        provider="tvepg_eurosport",
                        country="CH",
                        timezone="Europe/Zurich",
                        channel_id="eurosport.1",
                        channel_number="eurosport.1",
                        channel_name="Eurosport 1",
                        title=title,
                        start_at=start.isoformat(),
                        end_at=end.isoformat(),
                        source_url=TVEPG_EUROSPORT_1_GUIDE,
                        retrieved_at=utc_now_iso(),
                    )
                )
        pending = []

    for element in soup.find_all(["h1", "h2", "h3", "h4", "a"]):
        if element.name in {"h1", "h2", "h3", "h4"}:
            text = element.get_text(" ", strip=True)
            match = re.search(r"(Today|Tomorrow)\s*-\s*(\d{2}/\d{2}/\d{4})\s*-", text, re.I)
            if match:
                flush()
                current_date = datetime.strptime(match.group(2), "%d/%m/%Y").date()
            continue
        if current_date is None:
            continue
        text = element.get_text(" ", strip=True)
        match = re.match(r"^(\d{2}:\d{2})\s+(.+)$", text)
        if not match:
            continue
        title = match.group(2).strip()
        if not title:
            continue
        start = datetime.combine(current_date, datetime.strptime(match.group(1), "%H:%M").time(), tzinfo=zone)
        pending.append((start, title))

    flush()
    records = _deduplicate(records)
    if not records:
        raise SourceUnavailable("TVEpg Eurosport 1 官方频道页未返回目标日期节目。")
    return records
'''
          path.write_text(source + "\n" + override, encoding="utf-8")
          print("Installed runtime-safe TVEpg Eurosport 1 collector override.")
          PY

      - name: Validate Python sources
        run: python -m compileall -q src scripts

      - name: Collect configured official programme guides
        run: epg collect --days 1 --incremental

      - name: Force English translation for target channels
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from epg_tool.translation_fallback import translate_title

          path = Path("data/epg.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          languages = {
              "allente_se.vultra": "sv",
              "allente_no.euro1": "no",
              "digi4k_ro": "ro",
              "tvplus_eurosport_1": "tr",
              "tvplus_eurosport_2": "tr",
              "sbb_rs.euro4k": "sr",
          }
          inspected = 0
          changed = 0
          for programme in root.findall("programme"):
              channel = programme.get("channel")
              source = languages.get(channel)
              if not source:
                  continue
              title = programme.find("title")
              if title is None or not (title.text or "").strip():
                  continue
              inspected += 1
              old = title.text.strip()
              new = translate_title(old, source)
              if new and new != old:
                  title.text = new
                  changed += 1
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print(f"English translation pass: inspected={inspected}, changed={changed}")
          PY

      - name: Rebuild compressed XMLTV snapshot
        run: gzip -9 -c data/epg.xml > data/epg.xml.gz

      - name: Verify critical target channels before publishing
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          status = json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          root = ET.parse("data/epg.xml").getroot()
          wanted = {"allente_se.vultra": 0, "eurosport.1": 0}
          future = {key: 0 for key in wanted}
          now = datetime.now(timezone.utc)

          for programme in root.findall("programme"):
              channel = programme.get("channel")
              if channel not in wanted:
                  continue
              wanted[channel] += 1
              try:
                  dt = datetime.strptime(programme.get("start", ""), "%Y%m%d%H%M%S %z")
                  if dt >= now:
                      future[channel] += 1
              except (TypeError, ValueError):
                  pass

          for channel, count in wanted.items():
              if count == 0:
                  raise SystemExit(f"Critical channel {channel} has no programmes")
              if future[channel] == 0:
                  raise SystemExit(f"Critical channel {channel} has no future programmes")
              print(f"Verified {channel}: {count} programmes, {future[channel]} future")

          for provider in ("allente_se", "allente_no", "tvepg_eurosport"):
              item = status.get(provider, {})
              print(f"{provider}: status={item.get('status')!r}, records={item.get('records')!r}")
              if item.get("status") not in ("ok", "stale"):
                  raise SystemExit(f"Critical provider {provider} failed; refusing stale publish")
          PY

      - name: Publish refreshed snapshot when it changes
        run: |
          git config user.name "Cathy-epg refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_week.jsonl data/epg.xml data/epg.xml.gz data/status.json
          if git diff --cached --quiet; then
            echo "No programme-guide changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh official EPG snapshot"
          git push
