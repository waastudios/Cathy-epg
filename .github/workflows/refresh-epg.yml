name: Refresh official EPG

on:
  schedule:
    # GitHub Actions cron is UTC: 19:00 UTC = 03:00 China Standard Time (UTC+8) on the next calendar day.
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: refresh-official-epg
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and publish XMLTV snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Harden target official collectors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/epg_tool/sources.py")
          s = p.read_text(encoding="utf-8")

          # Canal+ Hodor currently rejects Chromium UAs from Linux/GitHub Actions.
          s = s.replace(
              '"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36",',
              '"User-Agent": "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:152.0) Gecko/20100101 Firefox/152.0",',
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Enable resilient English translation
        run: |
          python - <<'PY'
          import epg_tool.sources as sources
          from epg_tool.translation_fallback import translate_title

          # Translation must never turn a successful official EPG fetch into a stale
          # snapshot. Existing strict collectors are overridden only for title conversion.
          # Order inside translate_title: Google public endpoint -> MyMemory -> hard fallback.
          bindings = {
              "_translate_allente_se_title": "sv",
              "_translate_allente_no_title": "no",
              "_translate_canalplus_fr_title": "fr",
              "_translate_digi4k_title": "ro",
              "_translate_tvplus_eurosport_title": "tr",
              "_translate_sbb_eurosport_title": "sr",
              "_translate_magenta_tv_sky_de_title": "de",
          }
          for function_name, language in bindings.items():
              if hasattr(sources, function_name):
                  setattr(sources, function_name, lambda title, lang=language: translate_title(title, lang))
          print("Resilient English translation enabled for:", ", ".join(bindings))
          PY

      - name: Collect all configured official programme guides
        run: epg collect --days 7

      - name: Verify critical target channels before publishing
        run: |
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          status = json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          root = ET.parse("data/epg.xml").getroot()
          wanted = {"allente_se.vultra": 0, "foot+.fr": 0}
          now = datetime.now(timezone.utc)
          for programme in root.findall("programme"):
              channel = programme.get("channel")
              if channel in wanted:
                  wanted[channel] += 1

          for channel, count in wanted.items():
              if count == 0:
                  raise SystemExit(f"Critical channel {channel} has no programmes; refusing to publish.")
              print(f"Verified {channel}: {count} programmes")

          # A stale fallback is never acceptable for the two requested channels.
          for provider in ("allente_se", "canalplus_fr"):
              item = status.get(provider, {})
              provider_status = item.get("status")
              if provider_status != "ok":
                  raise SystemExit(
                      f"Critical provider {provider} is {provider_status!r}; refusing to publish stale EPG."
                  )
              print(f"{provider}: status=ok, records={item.get('records')!r}")

          # Ensure the critical channels contain at least one programme in the future.
          future = {key: 0 for key in wanted}
          for programme in root.findall("programme"):
              channel = programme.get("channel")
              if channel not in future:
                  continue
              start = programme.get("start", "")
              try:
                  dt = datetime.strptime(start, "%Y%m%d%H%M%S %z")
              except ValueError:
                  continue
              if dt >= now:
                  future[channel] += 1
          for channel, count in future.items():
              if count == 0:
                  raise SystemExit(f"Critical channel {channel} has no future programmes; refusing to publish.")
              print(f"Verified {channel}: {count} future programmes")

          for provider in ("allente_no", "canalplus_fr"):
              item = status.get(provider, {})
              print(f"{provider}: status={item.get('status')!r}, records={item.get('records')!r}, message={item.get('message')!r}")
          PY

      - name: Publish refreshed snapshot when it changes
        run: |
          git config user.name "Cathy-epg refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_week.jsonl data/epg.xml data/epg.xml.gz data/status.json
          if git diff --cached --quiet; then
            echo "No programme-guide changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh official EPG snapshot"
          git push
