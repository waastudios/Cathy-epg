name: Refresh official EPG

on:
  schedule:
    # GitHub Actions cron is UTC: 19:00 UTC = 03:00 China Standard Time (UTC+8) on the next calendar day.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-official-epg
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and publish XMLTV snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Collect all configured official programme guides
        run: epg collect --days 7

      - name: Generate Eurosport three-day guide
        run: python scripts/generate_eurosport_three_day.py

      - name: Publish refreshed snapshot when it changes
        run: |
          git config user.name "Cathy-epg refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_week.jsonl data/epg.xml data/epg.xml.gz data/status.json EUROSPORT-3DAY.md
          if git diff --cached --quiet; then
            echo "No programme-guide changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh official EPG snapshot"
          git push
