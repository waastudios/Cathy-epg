name: Refresh official EPG

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: refresh-official-epg
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and publish XMLTV snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Harden Canal+ official request
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/epg_tool/sources.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36",',
              '"User-Agent": "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:152.0) Gecko/20100101 Firefox/152.0",',
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate Python sources
        run: python -m compileall -q src scripts

      - name: Collect all configured official programme guides
        run: epg collect --days 7

      - name: Force English translation
        run: python scripts/translate_epg.py

      - name: Rebuild compressed XMLTV snapshot
        run: gzip -9 -c data/epg.xml > data/epg.xml.gz

      - name: Verify critical target channels before publishing
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          status = json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          root = ET.parse("data/epg.xml").getroot()
          wanted = {"allente_se.vultra": 0, "foot+.fr": 0}
          future = {key: 0 for key in wanted}
          now = datetime.now(timezone.utc)

          for programme in root.findall("programme"):
              channel = programme.get("channel")
              if channel not in wanted:
                  continue
              wanted[channel] += 1
              try:
                  dt = datetime.strptime(programme.get("start", ""), "%Y%m%d%H%M%S %z")
                  if dt >= now:
                      future[channel] += 1
              except (TypeError, ValueError):
                  pass

          for channel, count in wanted.items():
              if count == 0:
                  raise SystemExit(f"Critical channel {channel} has no programmes")
              if future[channel] == 0:
                  raise SystemExit(f"Critical channel {channel} has no future programmes")
              print(f"Verified {channel}: {count} programmes, {future[channel]} future")

          for provider in ("allente_se", "canalplus_fr"):
              item = status.get(provider, {})
              print(f"{provider}: status={item.get('status')!r}, records={item.get('records')!r}")
              if item.get("status") != "ok":
                  raise SystemExit(f"Critical provider {provider} failed; refusing stale publish")
          PY

      - name: Publish refreshed snapshot when it changes
        run: |
          git config user.name "Cathy-epg refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_week.jsonl data/epg.xml data/epg.xml.gz data/status.json
          if git diff --cached --quiet; then
            echo "No programme-guide changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh official EPG snapshot"
          git push
