name: Refresh official EPG

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: refresh-official-epg
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and publish XMLTV snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate Python sources
        run: python -m compileall -q src scripts

      - name: Collect configured official programme guides
        # Translation of non-English titles (everything except Chinese) happens
        # inside the collectors: version-controlled exact mapping first, then
        # the persistent translation memory, then online translation services.
        # A single untranslatable title only skips that programme, never the
        # whole provider.
        run: epg collect --days 7

      - name: Rebuild compressed XMLTV snapshot
        run: gzip -9 -c data/epg.xml > data/epg.xml.gz

      - name: Regenerate channel inventory
        run: python scripts/generate_channels_md.py

      - name: Verify critical target channels before publishing
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          status = json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          root = ET.parse("data/epg.xml").getroot()
          wanted = {
              "allente_se.vultra": 0,
              "eurosport.1": 0,
              "eurosport.2": 0,
              "eurosport.4k": 0,
              "digi4k_ro": 0,
          }
          future = {key: 0 for key in wanted}
          now = datetime.now(timezone.utc)

          for programme in root.findall("programme"):
              channel = programme.get("channel")
              if channel not in wanted:
                  continue
              wanted[channel] += 1
              try:
                  dt = datetime.strptime(programme.get("start", ""), "%Y%m%d%H%M%S %z")
                  if dt >= now:
                      future[channel] += 1
              except (TypeError, ValueError):
                  pass

          for channel, count in wanted.items():
              if count == 0:
                  raise SystemExit(f"Critical channel {channel} has no programmes")
              if future[channel] == 0:
                  raise SystemExit(f"Critical channel {channel} has no future programmes")
              print(f"Verified {channel}: {count} programmes, {future[channel]} future")

          for provider in ("allente_se", "allente_no", "sbb_rs", "digi4k_ro", "ee_uk", "sky_de"):
              item = status.get(provider, {})
              print(f"{provider}: status={item.get('status')!r}, records={item.get('records')!r}")
              if item.get("status") not in ("ok", "stale"):
                  raise SystemExit(f"Critical provider {provider} failed; refusing stale publish")
          PY

      - name: Publish refreshed snapshot when it changes
        run: |
          git config user.name "Cathy-epg refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_week.jsonl data/epg.xml data/epg.xml.gz data/status.json src/epg_tool/translation_cache.json CHANNELS.md
          if git diff --cached --quiet; then
            echo "No programme-guide changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh official EPG snapshot"
          git push
