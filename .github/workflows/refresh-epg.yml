name: Refresh official EPG

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: refresh-official-epg
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and publish XMLTV snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Harden and patch official collectors
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("src/epg_tool/sources.py")
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              '"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36",',
              '"User-Agent": "Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:152.0) Gecko/20100101 Firefox/152.0",',
          )

          tree = ast.parse(source)
          targets = {
              "_translate_allente_se_title": "sv",
              "_translate_allente_no_title": "no",
              "_translate_canalplus_fr_title": "fr",
              "_translate_digi4k_title": "ro",
              "_translate_tvplus_eurosport_title": "tr",
              "_translate_sbb_eurosport_title": "sr",
              "_translate_magenta_tv_sky_de_title": "de",
          }
          found = set()

          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              if node.name not in targets:
                  continue
              found.add(node.name)
              node.body = [
                  ast.ImportFrom(
                      module="epg_tool.translation_fallback",
                      names=[ast.alias(name="translate_title", asname="_cathy_translate_title")],
                      level=0,
                  ),
                  ast.Return(
                      value=ast.Call(
                          func=ast.Name(id="_cathy_translate_title", ctx=ast.Load()),
                          args=[ast.Name(id="title", ctx=ast.Load()), ast.Constant(value=targets[node.name])],
                          keywords=[],
                      )
                  ),
              ]

          missing = set(targets) - found
          if missing:
              raise SystemExit("Translation functions missing: " + ", ".join(sorted(missing)))

          ast.fix_missing_locations(tree)
          path.write_text(ast.unparse(tree) + "\n", encoding="utf-8")
          print("Patched translation functions:", ", ".join(sorted(found)))
          PY

      - name: Validate Python sources
        run: python -m compileall -q src scripts

      - name: Collect all configured official programme guides
        run: epg collect --days 7

      - name: Force English translation for target channels
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from epg_tool.translation_fallback import translate_title

          path = Path("data/epg.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          languages = {
              "allente_se.vultra": "sv",
              "allente_no.euro1": "no",
              "foot+.fr": "fr",
              "canal+.fr": "fr",
              "digi4k_ro": "ro",
              "tvplus_eurosport_1": "tr",
              "tvplus_eurosport_2": "tr",
              "sbb_rs.euro4k": "sr",
          }
          inspected = 0
          changed = 0
          for programme in root.findall("programme"):
              channel = programme.get("channel")
              source = languages.get(channel)
              if not source:
                  continue
              title = programme.find("title")
              if title is None or not (title.text or "").strip():
                  continue
              inspected += 1
              old = title.text.strip()
              new = translate_title(old, source)
              if new and new != old:
                  title.text = new
                  changed += 1
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print(f"English translation pass: inspected={inspected}, changed={changed}")
          PY

      - name: Rebuild compressed XMLTV snapshot
        run: gzip -9 -c data/epg.xml > data/epg.xml.gz

      - name: Verify critical target channels before publishing
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          status = json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          root = ET.parse("data/epg.xml").getroot()
          wanted = {"allente_se.vultra": 0, "foot+.fr": 0}
          future = {key: 0 for key in wanted}
          now = datetime.now(timezone.utc)

          for programme in root.findall("programme"):
              channel = programme.get("channel")
              if channel not in wanted:
                  continue
              wanted[channel] += 1
              try:
                  dt = datetime.strptime(programme.get("start", ""), "%Y%m%d%H%M%S %z")
                  if dt >= now:
                      future[channel] += 1
              except (TypeError, ValueError):
                  pass

          for channel, count in wanted.items():
              if count == 0:
                  raise SystemExit(f"Critical channel {channel} has no programmes")
              if future[channel] == 0:
                  raise SystemExit(f"Critical channel {channel} has no future programmes")
              print(f"Verified {channel}: {count} programmes, {future[channel]} future")

          for provider in ("allente_se", "allente_no", "canalplus_fr"):
              item = status.get(provider, {})
              print(f"{provider}: status={item.get('status')!r}, records={item.get('records')!r}")
              if item.get("status") not in ("ok",):
                  raise SystemExit(f"Critical provider {provider} failed; refusing stale publish")
          PY

      - name: Publish refreshed snapshot when it changes
        run: |
          git config user.name "Cathy-epg refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_week.jsonl data/epg.xml data/epg.xml.gz data/status.json
          if git diff --cached --quiet; then
            echo "No programme-guide changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh official EPG snapshot"
          git push
